name: Feature request
description: Suggest an improvement that benefits template users.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and any alternatives considered.
    validations:
      required: true
  - type: checkboxes
    id: standards
    attributes:
      label: Project standards
      options:
        - label: This can preserve accessibility, responsive behavior, and résumé-first customization.
          required: true
