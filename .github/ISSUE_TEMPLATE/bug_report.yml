name: Bug report
description: Report a reproducible problem with the template.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove personal or confidential résumé information before posting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Provide the smallest set of steps needed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and browser.
  - type: textarea
    id: checks
    attributes:
      label: Validation output
      description: Share relevant output from npm run check, with secrets removed.
